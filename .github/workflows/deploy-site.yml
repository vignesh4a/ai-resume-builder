name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-site.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: List variable names visible to this workflow
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          names="$(echo "$VARS_JSON" | jq -r 'keys | join(", ")')"
          echo "Repository/org variables visible: ${names:-<none>}"
          [ -z "$names" ] && echo "::warning::No Actions variables are visible. Add them under Settings > Secrets and variables > Actions > Variables tab > Repository variables." || true

      - name: Write public Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
        run: |
          # The site needs the API URL (https://<ref>.supabase.co), not a dashboard link.
          SUPABASE_URL="$(echo "${SUPABASE_URL:-}" | tr -d '[:space:]')"
          SUPABASE_ANON_KEY="$(echo "${SUPABASE_ANON_KEY:-}" | tr -d '[:space:]')"
          if ! echo "$SUPABASE_URL" | grep -qE '^https://[a-z0-9]+\.supabase\.co/?$'; then
            ref="$(echo "$SUPABASE_URL ${SUPABASE_PROJECT_REF:-}" | grep -oE '\b[a-z]{20}\b' | head -1 || true)"
            if [ -n "$ref" ]; then
              echo "::warning::SUPABASE_URL should look like https://<ref>.supabase.co - using https://$ref.supabase.co"
              SUPABASE_URL="https://$ref.supabase.co"
            fi
          fi
          SUPABASE_URL="${SUPABASE_URL%/}"
          if [ -n "$SUPABASE_ANON_KEY" ] && ! echo "$SUPABASE_ANON_KEY" | grep -qE '^(eyJ|sb_publishable_)'; then
            echo "::warning::SUPABASE_ANON_KEY doesn't look like an anon/publishable key (should start with eyJ or sb_publishable_)."
          fi
          payload="$(echo "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
          if echo "$SUPABASE_ANON_KEY" | grep -q '^sb_secret_' || echo "$payload" | grep -q '"role":"service_role"'; then
            echo "::error::SUPABASE_ANON_KEY is a SECRET key. Never put it in a website - use the anon / publishable key."
            exit 1
          fi
          [ -z "$SUPABASE_URL" ] && echo "::warning::SUPABASE_URL variable is empty - the site will show a setup banner."
          [ -z "$SUPABASE_ANON_KEY" ] && echo "::warning::SUPABASE_ANON_KEY variable is empty - the site will show a setup banner."
          cat > web/config.js <<EOF
          window.APP_CONFIG = {
            SUPABASE_URL: "${SUPABASE_URL}",
            SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}",
          };
          EOF

      # Optional: also publish to Cloudflare Pages (free *.pages.dev address) when its secrets are set.
      - name: Deploy to Cloudflare Pages
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'cvcraft' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare not configured - skipping (add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable)."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if ! curl -sS "${auth[@]}" "$api/$CF_PROJECT" | jq -e '.success' >/dev/null; then
            created="$(curl -sS "${auth[@]}" -H "Content-Type: application/json" -X POST "$api" \
              -d "$(jq -n --arg n "$CF_PROJECT" '{name: $n, production_branch: "main"}')")"
            if ! echo "$created" | jq -e '.success' >/dev/null; then
              echo "::error title=Cloudflare project::Could not create Pages project '$CF_PROJECT': $(echo "$created" | jq -c '.errors')"
              exit 1
            fi
          fi
          if ! out="$(npx --yes wrangler@3.114.0 pages deploy web --project-name="$CF_PROJECT" --branch=main --commit-dirty=true 2>&1)"; then
            echo "$out"
            echo "::error title=Cloudflare deploy failed::$(echo "$out" | tail -n 15 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "$out"
          sub="$(curl -sS "${auth[@]}" "$api/$CF_PROJECT" | jq -r '.result.subdomain')"
          echo "::notice title=Cloudflare Pages::Live at https://${sub}/"

      - name: Update sign-in redirect URLs
        if: steps.cloudflare.outcome == 'success'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'cvcraft' }}
        run: .github/scripts/update-auth-urls.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
