name: Deploy database & AI function to Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets/variables not set yet - skipping deploy. See README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Set function secrets
        if: steps.check.outputs.ready == 'true' && env.LLM_API_KEY != ''
        run: |
          args=("LLM_API_KEY=$LLM_API_KEY")
          [ -n "$LLM_BASE_URL" ] && args+=("LLM_BASE_URL=$LLM_BASE_URL")
          [ -n "$LLM_MODEL" ] && args+=("LLM_MODEL=$LLM_MODEL")
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"

      - name: Deploy edge function
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy generate-resume --project-ref "$SUPABASE_PROJECT_REF"
