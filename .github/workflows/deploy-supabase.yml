name: Deploy database & AI function to Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Accept the ref as a variable or a secret; fall back to deriving it from SUPABASE_URL.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: List variable names visible to this workflow
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          names="$(echo "$VARS_JSON" | jq -r 'keys | join(", ")')"
          echo "Repository/org variables visible: ${names:-<none>}"
          [ -z "$names" ] && echo "::warning::No Actions variables are visible. Add them under Settings > Secrets and variables > Actions > Variables tab > Repository variables." || true

      - name: Check configuration
        id: check
        run: |
          ref="$(echo "${SUPABASE_PROJECT_REF:-}" | tr -d '[:space:]')"
          if [ -z "$ref" ] && [ -n "$SUPABASE_URL" ]; then
            ref="$(echo "$SUPABASE_URL" | sed -E 's#^https?://([a-z0-9]+)\.supabase\.co.*#\1#')"
          fi
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -z "$ref" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -z "$LLM_API_KEY" ] && echo "::warning::LLM_API_KEY secret is not set - resume generation will fail until it is."
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing. Add them under Settings > Secrets and variables > Actions (Repository tab)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "Deploying to project $ref"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: |
          # Runs a CLI command; on failure the tail of its output becomes a visible annotation.
          run() {
            label="$1"; shift
            if "$@" > out.log 2>&1 < /dev/null; then code=0; else code=$?; fi
            cat out.log
            if [ $code -ne 0 ]; then
              msg="$(tail -n 25 out.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=${label} failed::${msg}"
              exit $code
            fi
          }
          run "supabase link" supabase link --project-ref "$SUPABASE_PROJECT_REF"
          run "supabase db push" supabase db push --include-all

      - name: Set function secrets
        if: steps.check.outputs.ready == 'true' && env.LLM_API_KEY != ''
        run: |
          # Runs a CLI command; on failure the tail of its output becomes a visible annotation.
          run() {
            label="$1"; shift
            if "$@" > out.log 2>&1 < /dev/null; then code=0; else code=$?; fi
            cat out.log
            if [ $code -ne 0 ]; then
              msg="$(tail -n 25 out.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=${label} failed::${msg}"
              exit $code
            fi
          }
          args=("LLM_API_KEY=$LLM_API_KEY")
          [ -n "$LLM_BASE_URL" ] && args+=("LLM_BASE_URL=$LLM_BASE_URL")
          [ -n "$LLM_MODEL" ] && args+=("LLM_MODEL=$LLM_MODEL")
          run "supabase secrets set" supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"

      - name: Deploy edge function
        if: steps.check.outputs.ready == 'true'
        run: |
          # Runs a CLI command; on failure the tail of its output becomes a visible annotation.
          run() {
            label="$1"; shift
            if "$@" > out.log 2>&1 < /dev/null; then code=0; else code=$?; fi
            cat out.log
            if [ $code -ne 0 ]; then
              msg="$(tail -n 25 out.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=${label} failed::${msg}"
              exit $code
            fi
          }
          run "supabase functions deploy" supabase functions deploy generate-resume --project-ref "$SUPABASE_PROJECT_REF"
